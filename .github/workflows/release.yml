# Release packaging: on a pushed tag (v*.*.*), build per OS/architecture, make
# each platform's package self-contained, and attach them to a GitHub Release.
#
# Five packages:
#   Isobar-<tag>-macOS-AppleSilicon.dmg
#   Isobar-<tag>-macOS-Intel.dmg
#   Isobar-<tag>-windows.zip             x64 (runs on Windows-on-ARM by emulation)
#   Isobar-<tag>-linux-x86_64.AppImage
#   Isobar-<tag>-linux-aarch64.AppImage  Raspberry Pi and other ARM boards
#
# The two Macs ship as separate downloads rather than one universal binary
# (decision 2026-08-01): each is built and tested on its own kind of Mac, and
# when Intel support is eventually dropped it is one matrix entry to delete.
#
# This is separate from build.yml so pushes to main only run the build+test
# gate; tags drive the actual release artifacts.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to treat as a release (for testing)'
        required: false

permissions:
  contents: write   # needed to create the release + upload assets

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS/Ubuntu versions are PINNED, not -latest, because the runner's
          # OS sets the package's minimum supported OS: we link (and ship) the
          # runner's Homebrew dylibs / glibc. Built on macos-latest, the v1.1.0
          # .app came out with minos 26.0 — unusable on any older macOS. 15 is
          # the oldest image with both CPU variants, so both Macs share a floor.
          - os: macos-15            # Apple Silicon
            arch: arm64
            suffix: macOS-AppleSilicon.dmg
          - os: macos-15-intel      # Intel
            arch: x86_64
            suffix: macOS-Intel.dmg
          # Ubuntu 22.04 = glibc 2.35, old enough for Debian 12 / Raspberry Pi
          # OS bookworm (2.36); 24.04's 2.39 would exclude them.
          - os: ubuntu-22.04
            arch: x86_64
            suffix: linux-x86_64.AppImage
          - os: ubuntu-22.04-arm
            arch: aarch64
            suffix: linux-aarch64.AppImage
          - os: windows-latest
            arch: x64
            suffix: windows.zip

    steps:
      - uses: actions/checkout@v7

      # The package name carries the ref. A TAG ref (v1.5.0) is already a
      # good filename; a BRANCH ref may not be - the documented way to test
      # packaging before a tag is a workflow_dispatch on a branch, and a
      # branch called release/v1.5.0 turned every artifact path into a
      # directory that does not exist, failing all five jobs after they had
      # built perfectly. Slashes become dashes so that dry run works.
      - name: Compose artifact name
        shell: bash
        run: echo "ARTIFACT=Isobar-${GITHUB_REF_NAME//\//-}-${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # dylibbundler embeds the Homebrew FLTK/RtAudio dylibs into the .app
        # so the .dmg runs on Macs without Homebrew installed (see Bundle step).
        # Installed one at a time and only when missing — see the same step in
        # build.yml for why (log noise from already-current formulae).
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          for pkg in cmake fltk rtaudio pkg-config dylibbundler; do
            brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libfltk1.3-dev libjpeg-dev libpng-dev zlib1g-dev \
            librtaudio-dev

      # Same vcpkg binary cache as build.yml - without it every release
      # spends ~13 minutes compiling FLTK/RtAudio from source on the
      # Windows runner. See build.yml for the full rationale.
      - name: Cache vcpkg binary packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-windows-static-md-fltk-rtaudio-${{ github.run_id }}
          restore-keys: |
            vcpkg-x64-windows-static-md-fltk-rtaudio-

      - name: Export vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        # x64-windows-static-md = static FLTK/RtAudio (no DLLs to ship),
        # dynamic CRT (/MD, present on every Windows machine).
        run: vcpkg --triplet x64-windows-static-md install fltk rtaudio

      - name: Configure (macOS / Linux)
        if: runner.os != 'Windows'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows, vcpkg toolchain)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (gate the release on the 18 headless tests)
        working-directory: build
        run: ctest -C Release --output-on-failure

      # --- Self-containment: each OS makes a package that runs WITHOUT
      #     FLTK/RtAudio pre-installed on the target machine. The mechanism
      #     differs per OS (no single one works for all three). ---

      # macOS: Homebrew only ships shared dylibs, so embed them into the .app.
      # dylibbundler walks otool -L, copies every Homebrew dylib (and its
      # transitive deps) into Contents/Libraries/, and rewrites install names
      # to @executable_path/../Libraries. Re-codesign ad-hoc AFTER — the
      # install-name rewrite invalidates the existing signature.
      - name: Bundle dylibs (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="build/Isobar.app"
          dylibbundler -od -b \
            -x "$APP/Contents/MacOS/Isobar" \
            -d "$APP/Contents/Libraries" \
            -p "@executable_path/../Libraries" \
            -i "/usr/lib/system:/System/Library/Frameworks"
          codesign --force --deep --sign - "$APP"
          # Gate: fail loudly if any Homebrew path leaked into the bundle.
          if otool -L "$APP/Contents/MacOS/Isobar" | grep -i homebrew; then
            echo "ERROR: Homebrew dylib path leaked into the bundle"; exit 1
          fi
          echo "Bundle is self-contained."
          # Gate: the .dmg must match the CPU it is named for, and must not
          # quietly require a newer macOS than the runner we pinned.
          lipo -info "$APP/Contents/MacOS/Isobar" | grep -q '${{ matrix.arch }}' \
            || { echo "ERROR: binary is not ${{ matrix.arch }}"; exit 1; }
          otool -l "$APP/Contents/MacOS/Isobar" | grep -m1 minos

      # Linux: AppImage. linuxdeploy runs ldd on the binary, copies every
      # non-system .so into the AppDir, writes an AppRun launcher, and packs
      # a SquashFS .AppImage the user chmods +x and runs. (Static-linking is
      # not viable on Linux: glibc can't be static-linked and Ubuntu's
      # librtaudio-dev ships no static lib anyway.)
      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          # Run the linuxdeploy AppImages by self-extraction instead of
          # mounting them — runner images don't reliably carry FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # linuxdeploy + its appimage output plugin (continuous channel),
          # for this job's architecture.
          BASE=https://github.com/linuxdeploy
          wget -q "$BASE/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage"
          wget -q "$BASE/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-${{ matrix.arch }}.AppImage"
          chmod +x linuxdeploy-${{ matrix.arch }}.AppImage linuxdeploy-plugin-appimage-${{ matrix.arch }}.AppImage

          # Lay out the AppDir (FHS-style: usr/bin, usr/share/...).
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          install -m755 build/isobar-gui    AppDir/usr/bin/isobar-gui
          install -m755 build/isobar-decode AppDir/usr/bin/isobar-decode
          install -m644 assets/isobar.desktop        AppDir/usr/share/applications/
          install -m644 assets/isobar-512.png        AppDir/usr/share/icons/hicolor/512x512/apps/isobar.png
          # the runtime window-icon lookup wants isobar-128.png next to the
          # exe (main.cpp exe_dir()) — the CPack rule that ships it never
          # runs for AppImages, so place it by hand
          install -m644 assets/isobar-128.png        AppDir/usr/bin/

          # linuxdeploy deploys all .so deps + writes AppRun + emits the AppImage.
          export OUTPUT="$ARTIFACT"
          ./linuxdeploy-${{ matrix.arch }}.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/isobar-gui \
            --desktop-file AppDir/usr/share/applications/isobar.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/isobar.png \
            --output appimage
          mv "$ARTIFACT" build/

      - name: Package CPack (macOS / Windows)
        if: runner.os != 'Linux'
        working-directory: build
        run: cpack -C Release

      # macOS CPack (DragNDrop) names it Isobar-<ver>-Darwin.dmg; Windows CPack
      # (ZIP) names it Isobar-<ver>-win64.zip. Rename to the per-package release
      # name. (Linux's AppImage was already named correctly by OUTPUT= above.)
      - name: Rename CPack artifact (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p out
          mv build/Isobar-*.* out/ 2>/dev/null || mv build/Isobar-* out/
          echo "Renamed to: $(ls out/)"
          mv out/Isobar-* "out/$ARTIFACT"

      # Windows: sanity-check that the static link actually took — no FLTK/
      # RtAudio DLLs should be sitting next to the exe in the package.
      - name: Verify no dependency DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== DLLs next to isobar-gui.exe in the ZIP install tree ==="
          $installDir = "build\_CPack_Packages\win64\ZIP\Isobar-*\bin"
          $dlls = Get-ChildItem -Path $installDir -Filter *.dll -ErrorAction SilentlyContinue
          if ($dlls) {
            Write-Host "Found DLLs (may indicate non-static linkage):"
            $dlls | Format-Table Name
            $bad = $dlls | Where-Object { $_.Name -match 'fltk|rtaudio' }
            if ($bad) { Write-Host "ERROR: FLTK/RtAudio DLL present — not self-contained"; exit 1 }
          } else {
            Write-Host "No DLLs next to the exe — self-contained. Good."
          }

      # Linux's AppImage landed in build/; macOS/Windows already moved theirs
      # to out/ in the Rename step. Get Linux's into out/ too so the upload
      # step has one consistent path.
      - name: Stage artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p out
          mv "build/$ARTIFACT" out/
          ls -la out/

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.os }}
          path: out/${{ env.ARTIFACT }}

  publish:
    name: publish GitHub Release
    needs: package
    # Tags only. A manual workflow_dispatch on a branch then builds all five
    # packages and leaves them as workflow artifacts to inspect, without
    # creating a GitHub Release named after the branch — that is how packaging
    # changes get tested before a tag goes out.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
