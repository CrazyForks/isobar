# Cross-platform build + test for Isobar.
#
# Matrix: macOS / Linux / Windows, on both Intel and ARM. Each job installs the
# FLTK + RtAudio dependencies, configures with CMake, builds, and runs the 14
# headless ctest tests (no audio hardware, no display needed).
# Raw build artifacts are uploaded per OS for manual inspection.
#
# See docs/README.md "Legal / provenance policy": this workflow only ever
# builds from committed source; no decompiled artifacts are involved.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both CPU families of every OS the release ships, so an
        # architecture-specific break shows up on a push rather than at tag
        # time. (Windows ARM is not built: the x64 .zip runs there under the
        # OS's own emulation.)
        os:
          - macos-latest        # Apple Silicon
          - macos-15-intel      # Intel
          - ubuntu-latest       # x86_64
          - ubuntu-22.04-arm    # ARM64 (Raspberry Pi class)
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      # Only install what is missing. The runner image already ships cmake and
      # pkgconf, and `brew install` on a package that is already current is not
      # a no-op — it prints "Warning: <pkg> is already installed and
      # up-to-date", which is noise in a log people read to find real warnings.
      # HOMEBREW_NO_AUTO_UPDATE keeps brew from refreshing (and complaining
      # about) taps we do not use.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          for pkg in cmake fltk rtaudio pkg-config; do
            brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libfltk1.3-dev libjpeg-dev libpng-dev zlib1g-dev \
            librtaudio-dev

      # vcpkg is preinstalled on the windows-latest image. We use the
      # x64-windows-static-md triplet so FLTK + RtAudio (and their png/jpeg/z
      # deps) are STATIC-linked into the .exe — no FLTK/RtAudio DLLs need
      # shipping. The MSVC runtime stays dynamic (/MD), which matches CMake's
      # default CMAKE_MSVC_RUNTIME_LIBRARY policy and is present on every
      # Windows machine. (Fully-static /MT via x64-windows-static causes
      # LNK2038 CRT-linkage mismatches and isn't worth it.)
      # Without this the Windows job takes ~13 minutes and the other four
      # take under one: brew and apt hand out prebuilt binaries, while
      # vcpkg COMPILES fltk, rtaudio, libpng, libjpeg and zlib from source
      # every run (13m01s of a 13m41s job on run 30729941242; our own code
      # builds there in 23 s). vcpkg drops each built package into a binary
      # cache, so caching that directory turns the install step into an
      # unpack. A miss just rebuilds exactly as before - nothing breaks,
      # it is only slow again. The key carries the port list; the vcpkg
      # baseline moves with the runner image, hence the restore-key.
      - name: Cache vcpkg binary packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-windows-static-md-fltk-rtaudio-${{ github.run_id }}
          restore-keys: |
            vcpkg-x64-windows-static-md-fltk-rtaudio-

      - name: Export vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg --triplet x64-windows-static-md install fltk rtaudio

      - name: Configure (macOS / Linux)
        if: runner.os != 'Windows'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows, vcpkg toolchain)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-${{ matrix.os }}
          # The build outputs: the CLI decoder, the GUI, and the test binaries.
          # On macOS the GUI is inside Isobar.app.
          path: |
            build/isobar-decode*
            build/isobar-gui*
            build/Isobar.app/**
            build/*-test*
            build/playwav*
          if-no-files-found: ignore
